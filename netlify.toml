[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_PATHS = "docs/**"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self \"https://js.stripe.com\")"
    # Report-only for now: violations appear in the browser console; nothing is blocked.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.sanity.io https://www.googletagmanager.com https://*.google-analytics.com; font-src 'self'; connect-src 'self' https://cdn.sanity.io https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; media-src 'self' https://cdn.sanity.io; frame-src https://challenges.cloudflare.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Groupon voucher redemption â€” customers guess at this, so catch the obvious
# variants rather than serving a 404 to someone holding a paid voucher.
[[redirects]]
  from = "/redeem"
  to = "/groupon"
  status = 301

[[redirects]]
  from = "/voucher"
  to = "/groupon"
  status = 301

[[redirects]]
  from = "/vouchers"
  to = "/groupon"
  status = 301

[[redirects]]
  from = "/groupon-voucher"
  to = "/groupon"
  status = 301

